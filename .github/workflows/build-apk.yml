name: Build AURA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            for i in 1 2 3 4 5 6 7 8; do
              chunk=$(grep -E "^e: |What went wrong|error:" -A2 build.log | sed -n "$(( (i-1)*12 + 1 )),$(( i*12 ))p" | sed 's/file:\/\/\/home\/runner\/work\/Aura\/Aura\///' | tr '\n' '|' | cut -c1-1800)
              [ -n "$chunk" ] && echo "::error title=build-$i::$chunk"
            done
          fi
          exit $code

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AURA-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-release
          path: AURA-release.apk
          if-no-files-found: error
