name: Build Breathe APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare signing key (from Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error title=secret-check::KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aura.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aura.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            for i in 1 2 3 4 5 6 7 8; do
              chunk=$(grep -E "^e: |What went wrong|error:" -A2 build.log | sed -n "$(( (i-1)*12 + 1 )),$(( i*12 ))p" | sed 's/file:\/\/\/home\/runner\/work\/Aura\/Aura\///' | tr '\n' '|' | cut -c1-1800)
              [ -n "$chunk" ] && echo "::error title=build-$i::$chunk"
            done
          fi
          exit $code

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Breathe-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Breathe-release
          path: Breathe-release.apk
          if-no-files-found: error

      - name: Publish release (used by in-app update)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Breathe-release.apk \
            --repo "${{ github.repository }}" \
            --title "Breathe ${{ github.run_number }}" \
            --notes "גרסה ${{ github.run_number }}" --latest
